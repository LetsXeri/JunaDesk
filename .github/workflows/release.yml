name: Prepare preview
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string
      sign_windows:
        description: Sign the Windows installer with the configured Azure profile
        default: false
        type: boolean

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  SIGN_WINDOWS: ${{ inputs.sign_windows || false }}
concurrency:
  group: preview-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installer:
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            label: macOS-arm64
            extension: dmg
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            label: Windows-x64
            extension: exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Check out media build recipes
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: release-recipes
          sparse-checkout: scripts
          persist-credentials: false
      - name: Pin recipe and application revisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media-build/sources
          cp release-recipes/scripts/{build-ffmpeg.sh,THIRD-PARTY.txt} scripts/
          printf 'JunaDesk %s\nMedia build recipes %s\n' \
            "$(git rev-parse HEAD)" "$(git -C release-recipes rev-parse HEAD)" > media-build/sources/REVISIONS.txt
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: rustup update stable
      - run: rustup target add ${{ matrix.target }}
      - run: npm ci
      - name: Check release version
        shell: bash
        run: GITHUB_REF_NAME="$RELEASE_TAG" node scripts/check-release-version.mjs
      - if: runner.os == 'Windows'
        name: Test native Windows playback before packaging
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed.' }
          cargo test --locked --manifest-path src-tauri/Cargo.toml native_player_loads_loops_and_pauses_an_h264_wallpaper
      - if: runner.os == 'Windows' && inputs.sign_windows
        name: Check Windows signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
        run: |
          $settings = @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID',
                        'SIGNING_ENDPOINT', 'SIGNING_ACCOUNT', 'SIGNING_PROFILE')
          $missing = $settings | Where-Object { ![Environment]::GetEnvironmentVariable($_) }
          if ($missing) { throw "Missing Windows signing settings: $($missing -join ', ')." }
      - if: runner.os == 'macOS'
        name: Build macOS media tools
        run: |
          command -v pkg-config || brew install pkgconf
          npm run native:mac
          bash scripts/build-ffmpeg.sh
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            curl
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
      - if: runner.os == 'Windows'
        name: Build static Windows import tools
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg.sh
      - if: runner.os == 'macOS'
        name: Build macOS installer
        run: npm run tauri build -- --target ${{ matrix.target }} -- --locked
      - if: runner.os == 'Windows' && inputs.sign_windows
        name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - if: runner.os == 'Windows' && inputs.sign_windows
        name: Build signed Windows installer
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
        run: |
          $clientVersion = '1.0.128'
          nuget install Microsoft.ArtifactSigning.Client -Version $clientVersion -OutputDirectory $env:RUNNER_TEMP -Source https://api.nuget.org/v3/index.json -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'Artifact Signing client installation failed.' }
          $clientDir = Join-Path $env:RUNNER_TEMP "Microsoft.ArtifactSigning.Client.$clientVersion"
          $env:JUNADESK_SIGNING_DLIB = (Resolve-Path -LiteralPath (Join-Path $clientDir 'bin/x64/Azure.CodeSigning.Dlib.dll')).Path
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $signTool = Get-ChildItem -LiteralPath $sdk -Directory |
            Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' -and (Test-Path (Join-Path $_.FullName 'x64/signtool.exe')) } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (!$signTool) { throw 'SignTool was not found in the Windows SDK.' }
          $env:JUNADESK_SIGNTOOL = Join-Path $signTool.FullName 'x64/signtool.exe'

          $env:JUNADESK_SIGNING_METADATA = Join-Path $env:RUNNER_TEMP 'junadesk-signing.json'
          @{
            Endpoint = $env:SIGNING_ENDPOINT
            CodeSigningAccountName = $env:SIGNING_ACCOUNT
            CertificateProfileName = $env:SIGNING_PROFILE
            CorrelationId = "JunaDesk-${{ github.run_id }}"
          } | ConvertTo-Json | Set-Content -LiteralPath $env:JUNADESK_SIGNING_METADATA

          $signScript = (Resolve-Path release-recipes/scripts/sign-windows.ps1).Path
          $media = Get-ChildItem -LiteralPath src-tauri/resources -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.dll' }
          & $signScript -Path $media.FullName

          $configuration = Join-Path $env:RUNNER_TEMP 'junadesk-tauri-signing.json'
          @{
            bundle = @{ windows = @{ signCommand = @{
              cmd = 'pwsh'
              args = @('-NoProfile', '-NonInteractive', '-File', $signScript, '%1')
            } } }
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $configuration
          npm run tauri build -- --config "$configuration" --target ${{ matrix.target }} -- --locked
          if ($LASTEXITCODE -ne 0) { throw 'Signed Windows setup build failed.' }
      - if: ${{ runner.os == 'Windows' && !inputs.sign_windows }}
        name: Build unsigned Windows installer
        run: npm run tauri build -- --target ${{ matrix.target }} -- --locked
      - name: Test playback and packaged media tools
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --include-ignored
      - if: runner.os == 'Windows'
        name: Test upgrade, installed files and uninstaller
        shell: pwsh
        timeout-minutes: 5
        run: |
          $installer = Get-ChildItem src-tauri/target/${{ matrix.target }}/release/bundle/nsis -File -Filter '*-setup.exe'
          if (@($installer).Count -ne 1) { throw 'Expected a single Windows setup executable.' }
          & ./release-recipes/scripts/test-windows-installer.ps1 -Installer $installer.FullName
      - name: Collect installer and source archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          LABEL: ${{ matrix.label }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          set -euo pipefail
          mkdir -p release
          installer=$(find "src-tauri/target/$TARGET/release/bundle" -type f -name "*.$EXTENSION" -print)
          test -f "$installer"
          cp "$installer" "release/JunaDesk-$RELEASE_TAG-$LABEL.$EXTENSION"
          tar -czf "release/JunaDesk-$RELEASE_TAG-$LABEL-Medienquellen.tar.gz" -C media-build/sources .
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.label }}
          path: release/
          if-no-files-found: error

  draft:
    runs-on: ubuntu-latest
    needs: installer
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      - name: Write SHA-256 checksums
        working-directory: release
        run: |
          set -euo pipefail
          for platform in macOS-arm64 Windows-x64; do
            test -s "JunaDesk-$RELEASE_TAG-$platform-Medienquellen.tar.gz"
          done
          test -s "JunaDesk-$RELEASE_TAG-macOS-arm64.dmg"
          test -s "JunaDesk-$RELEASE_TAG-Windows-x64.exe"
          sha256sum JunaDesk-* > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Upload draft preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = true
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --draft --prerelease \
              --title "JunaDesk $RELEASE_TAG Preview" --notes-file .github/release-notes.md
          fi
