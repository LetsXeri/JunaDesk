[package]
name = "junadesk"
version = "0.1.1"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tempfile = "3"
tokio = { version = "1", features = ["time", "sync"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSBundle"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest",
  "UNNotificationSettings", "UNNotificationTrigger", "UNNotification", "block2"
] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-notification = "2.8.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_Devices_Display", "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security",
  "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"
] }
