name: Prepare preview
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
concurrency:
  group: preview-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            label: macOS-arm64
            extension: dmg
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            label: Windows-x64
            extension: exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Check out media build recipes
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: release-recipes
          sparse-checkout: scripts
          persist-credentials: false
      - name: Pin recipe and application revisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media-build/sources
          cp release-recipes/scripts/{build-ffmpeg.sh,bundle-windows-player.sh,THIRD-PARTY.txt} scripts/
          printf 'JunaDesk %s\nMedia build recipes %s\n' \
            "$(git rev-parse HEAD)" "$(git -C release-recipes rev-parse HEAD)" > media-build/sources/REVISIONS.txt
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: rustup update stable
      - run: rustup target add ${{ matrix.target }}
      - run: npm ci
      - name: Check release version
        shell: bash
        run: GITHUB_REF_NAME="$RELEASE_TAG" node scripts/check-release-version.mjs
      - if: runner.os == 'macOS'
        name: Build macOS media tools
        run: |
          command -v pkg-config || brew install pkgconf
          npm run native:mac
          bash scripts/build-ffmpeg.sh
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            curl
            libarchive
            mingw-w64-ucrt-x86_64-binutils
      - if: runner.os == 'Windows'
        name: Prepare Windows media tools and corresponding sources
        shell: msys2 {0}
        run: bash scripts/bundle-windows-player.sh
      - if: runner.os == 'Windows'
        name: Smoke test bundled mpv outside MSYS2
        shell: pwsh
        timeout-minutes: 2
        run: |
          Add-Type -TypeDefinition @'
          using System.Runtime.InteropServices;
          public static class WindowsErrorMode {
              [DllImport("kernel32.dll")]
              public static extern uint SetErrorMode(uint mode);
          }
          '@
          [void][WindowsErrorMode]::SetErrorMode(0x8003)
          $player = Resolve-Path src-tauri/resources/mpv.exe
          $video = Resolve-Path src-tauri/testdata/test-vp9.webm
          $log = Join-Path $env:RUNNER_TEMP 'junadesk-mpv-smoke.log'
          $start = [System.Diagnostics.ProcessStartInfo]::new($player.Path)
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          foreach ($argument in @('--no-config', '--msg-level=all=v', '--vo=null', '--ao=null', '--frames=2', "--log-file=$log", $video.Path)) {
            $start.ArgumentList.Add($argument)
          }
          $process = [System.Diagnostics.Process]::Start($start)
          if (-not $process.WaitForExit(30000)) {
            $process.Kill($true)
            if (Test-Path $log) { Get-Content $log -Tail 35 }
            throw 'Bundled mpv did not exit within 30 seconds.'
          }
          if (Test-Path $log) { Get-Content $log -Tail 12 }
          if ($process.ExitCode -ne 0) { throw "Bundled mpv exited with $($process.ExitCode)" }
      - name: Build installer
        run: npm run tauri build -- --target ${{ matrix.target }} -- --locked
      - name: Test packaged media tools
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --include-ignored
      - name: Collect installer and source archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          LABEL: ${{ matrix.label }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          set -euo pipefail
          mkdir -p release
          installer=$(find "src-tauri/target/$TARGET/release/bundle" -type f -name "*.$EXTENSION" -print)
          test -f "$installer"
          cp "$installer" "release/JunaDesk-$RELEASE_TAG-$LABEL.$EXTENSION"
          tar -czf "release/JunaDesk-$RELEASE_TAG-$LABEL-Medienquellen.tar.gz" -C media-build/sources .
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.label }}
          path: release/
          if-no-files-found: error

  draft:
    runs-on: ubuntu-latest
    needs: installer
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      - name: Write SHA-256 checksums
        working-directory: release
        run: |
          set -euo pipefail
          for platform in macOS-arm64 Windows-x64; do
            test -s "JunaDesk-$RELEASE_TAG-$platform-Medienquellen.tar.gz"
          done
          test -s "JunaDesk-$RELEASE_TAG-macOS-arm64.dmg"
          test -s "JunaDesk-$RELEASE_TAG-Windows-x64.exe"
          sha256sum JunaDesk-* > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Upload draft preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = true
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --draft --prerelease \
              --title "JunaDesk $RELEASE_TAG Preview" --notes-file .github/release-notes.md
          fi
