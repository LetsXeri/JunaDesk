name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: rustup update stable
      - run: npm ci
      - run: npm run build
      - if: runner.os == 'macOS'
        run: npm run native:mac
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
